name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - "pytest.ini"
      - ".gitattributes"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libwayland-dev libfontconfig-dev

      - name: Check (prod)
        run: cargo check

      - name: Check (test-rpc)
        run: cargo check --features test-rpc

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libwayland-dev libfontconfig-dev mesa-vulkan-drivers \
            xvfb xauth xdotool scrot gnome-screenshot python3-tk fonts-noto-cjk

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install E2E test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Test desktop driver acknowledgement safeguards
        run: python -m pytest tests/unit -q

      - name: Build (test-rpc)
        run: cargo build --features test-rpc

      - name: Run Rust regression tests
        run: cargo test --features test-rpc

      - name: Run E2E tests
        run: |
          xvfb-run -a -s "-screen 0 1600x1200x24" python -m pytest tests/e2e -v --app-binary target/debug/git_master --junitxml=test-results/e2e.xml

      - name: Upload E2E results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
